# Dumb-HTTP git mirror. The bare repo lives at /var/lib/git/hypit.git and is
# served as static files. Clients `git clone http://<host>/hypit.git` resolve
# refs through /info/refs and fetch packs through /objects/pack/* — both
# standard git paths that every git client understands.
#
# Read-only by construction: there is no CGI here to receive a push, so
# `git-receive-pack` is unreachable and `git push` fails cleanly.

server {
    listen       80 default_server;
    server_name  _;

    # 500MB matches the http.postBuffer set in the Dockerfile; some
    # workspace operations stream large blobs.
    client_max_body_size 500m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # /info/refs is rewritten by `git update-server-info` to advertise refs.
    # It must be served fresh so the client sees a current HEAD pointer.
    location = /hypit.git/info/refs {
        alias /var/lib/git/hypit.git/info/refs;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Type "text/plain" always;
    }

    # Pack files are immutable — cache hard on the LAN. Use a captured
    # group so the filename appends to the alias instead of being eaten by
    # the regex match (which would otherwise leave nginx trying to serve
    # the directory and emitting a 301 redirect).
    location ~ ^/hypit\.git/objects/pack/(.+\.pack)$ {
        alias /var/lib/git/hypit.git/objects/pack/$1;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~ ^/hypit\.git/objects/pack/(.+\.idx)$ {
        alias /var/lib/git/hypit.git/objects/pack/$1;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Loose objects (/objects/XX/<40 hex>) and everything else under
    # /hypit.git/ (HEAD, refs/, packed-refs, info/refs, …) is served by the
    # catch-all below. nginx regex locations don't support `{n}` quantifiers
    # and matching 40 hex chars explicitly would balloon the config, so we
    # let the broad alias handle it.

    # Anything else under /hypit.git/ is repo metadata (HEAD, refs/, packed-refs,
    # etc.). Pass-through with a short cache so a flurry of clones sees the same
    # view without round-tripping nginx cache logic.
    location /hypit.git/ {
        alias /var/lib/git/hypit.git/;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        return 404 "Not Found\n";
        add_header Content-Type text/plain;
    }
}
