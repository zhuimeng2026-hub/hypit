# Internal mirrors for a Hypit installation on a closed LAN.
#
# What lives here
#   - verdaccio        — npm/pnpm registry proxy + cache (port 4873)
#   - pypi-mirror      — nginx fronting pypi.org with on-disk proxy_cache (port 4874).
#                         Serves a PEP 503 simple index so `uv` resolves packages against it.
#   - chrome-mirror    — nginx serving chrome-for-testing archives (port 8088)
#   - ffmpeg-mirror    — nginx serving BtbN ffmpeg builds for win/linux/mac (port 8089)
#   - whisperx-lan-proxy
#                       — socat in host network mode, exposing the loopback-only
#                         `hypit-whisperx` service already running on this box
#                         (0.0.0.0:18765 -> 127.0.0.1:8765)
#   - git-mirror       — bare-repo smart-http mirror of github.com/hypit-ai/hypit
#                         (port 3030). Read-only; one-way `git fetch` every hour.
#
# Bootstrap
#   cp .env.example .env  &&  edit HYPIT_LAN_HOST and ports as needed
#   docker compose pull
#   docker compose up -d
#   docker compose run --rm chrome-mirror-bootstrap     # one-time Chrome fetch
#   docker compose run --rm ffmpeg-mirror-bootstrap     # one-time ffmpeg fetch
#
# All mirrors are designed to be the SOLE upstream for Win10 clients; the
# clients never reach the public internet.

name: hypit-internal-mirrors

x-data-root: &data_root ${HYPIT_DATA_ROOT:-/opt/hypit/.internal-mirrors}

services:
  verdaccio:
    image: verdaccio/verdaccio:${HYPIT_VERDACCIO_TAG:-6}
    container_name: hypit-verdaccio
    restart: unless-stopped
    ports:
      - "${HYPIT_NPM_PORT:-4873}:4873"
    environment:
      VERDACCIO_HOST: 0.0.0.0
    volumes:
      - ./verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro
      - verdaccio-storage:/verdaccio/storage
      - verdaccio-plugins:/verdaccio/plugins
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4873/-/ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  pypi-mirror:
    # PEP 503 simple index for uv. Pure nginx reverse proxy with on-disk proxy_cache,
    # backed by pypi.org (or HYPIT_PYPI_UPSTREAM). The simple index, JSON metadata, and
    # wheel/sdist tarballs are all transparently cached.
    image: nginx:${HYPIT_NGINX_TAG:-1.27-alpine}
    container_name: hypit-pypi-mirror
    restart: unless-stopped
    ports:
      - "${HYPIT_PYPI_PORT:-4874}:80"
    environment:
      HYPIT_PYPI_UPSTREAM: ${HYPIT_PYPI_UPSTREAM:-https://pypi.org/}
    volumes:
      - ./nginx/conf.d/pypi-mirror.conf:/etc/nginx/conf.d/pypi-mirror.conf:ro
      - pypi-mirror-cache:/var/cache/nginx/pypi
      - pypi-mirror-tmp:/var/lib/nginx/tmp
    healthcheck:
      # nginx:alpine ships with wget — `/healthz` is defined in the server block below.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

  chrome-mirror:
    image: nginx:${HYPIT_NGINX_TAG:-1.27-alpine}
    container_name: hypit-chrome-mirror
    restart: unless-stopped
    ports:
      - "${HYPIT_CHROME_PORT:-8088}:80"
    volumes:
      - ./nginx/conf.d/chrome-mirror.conf:/etc/nginx/conf.d/chrome-mirror.conf:ro
      - chrome-mirror-data:/usr/share/nginx/html:ro
    # Use the same nginx for both chrome and ffmpeg; the chrome-mirror container only
    # exposes the chrome server block, but the volume is shared with ffmpeg-mirror via
    # a sibling service in the same compose.
    depends_on: []

  chrome-mirror-bootstrap:
    # One-shot container that downloads the pinned chrome-for-testing archives into the
    # shared volume. Run once after the first `up`, or whenever HYPIT_CHROME_VERSION
    # changes. Mounts the same volume as chrome-mirror in read-write mode.
    image: curlimages/curl:8.10.1
    container_name: hypit-chrome-mirror-bootstrap
    profiles: ["bootstrap"]
    user: "0:0"
    environment:
      HYPIT_CHROME_VERSION: ${HYPIT_CHROME_VERSION:-156.0.8073.0}
      HYPIT_CHROME_UPSTREAM: ${HYPIT_CHROME_UPSTREAM:-https://storage.googleapis.com/chrome-for-testing-public/}
    volumes:
      - chrome-mirror-data:/out
      - ./nginx/scripts/bootstrap-chrome-mirror.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]

  ffmpeg-mirror:
    image: nginx:${HYPIT_NGINX_TAG:-1.27-alpine}
    container_name: hypit-ffmpeg-mirror
    restart: unless-stopped
    ports:
      - "${HYPIT_FFMPEG_PORT:-8089}:80"
    volumes:
      - ./nginx/conf.d/ffmpeg-mirror.conf:/etc/nginx/conf.d/ffmpeg-mirror.conf:ro
      - ffmpeg-mirror-data:/usr/share/nginx/html:ro

  ffmpeg-mirror-bootstrap:
    image: curlimages/curl:8.10.1
    container_name: hypit-ffmpeg-mirror-bootstrap
    profiles: ["bootstrap"]
    user: "0:0"
    volumes:
      - ffmpeg-mirror-data:/out
      - ./nginx/scripts/bootstrap-ffmpeg-mirror.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]

  whisperx-lan-proxy:
    # The local `hypit-whisperx` service binds 127.0.0.1:8765 on this box (see
    # services/whisperx/src/hypit_whisperx_service/server.py:89). This container shares
    # the host network namespace, listens on the LAN-reachable 18765, and forwards each
    # connection to loopback:8765. It is the cheapest way to expose the service without
    # restarting it.
    image: alpine/socat:${HYPIT_SOCAT_TAG:-1.8.0.0}
    container_name: hypit-whisperx-lan-proxy
    restart: unless-stopped
    network_mode: host
    # Two separate YAML entries so socat receives two addresses, not one quoted string.
    command:
      - "TCP-LISTEN:${HYPIT_WHISPERX_LAN_PORT:-18765},reuseaddr,fork,bind=0.0.0.0"
      - "TCP:127.0.0.1:8765"
    healthcheck:
      # /dev/tcp isn't in musl ash, so do an explicit nc loopback dial instead.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${HYPIT_WHISPERX_LAN_PORT:-18765}"]
      interval: 30s
      timeout: 3s
      retries: 5

  git-mirror:
    # Read-only smart-HTTP mirror of github.com/hypit-ai/hypit.git so a Win10 client
    # with no public internet can still `git clone` the source tree. Built from
    # utils/git-mirror/ (nginx + fcgiwrap + git). First boot does a `git clone --bare`
    # from HYPIT_GIT_UPSTREAM (long pole — ~150MB); afterwards a background loop
    # `git fetch origin` every HYPIT_GIT_REFRESH_SECONDS keeps refs fresh.
    build:
      context: ./git-mirror
    image: hypit/git-mirror:${HYPIT_GIT_MIRROR_TAG:-1}
    container_name: hypit-git-mirror
    restart: unless-stopped
    ports:
      - "${HYPIT_GIT_PORT:-3030}:80"
    environment:
      HYPIT_GIT_UPSTREAM: ${HYPIT_GIT_UPSTREAM:-https://github.com/hypit-ai/hypit.git}
      HYPIT_GIT_REFRESH_SECONDS: ${HYPIT_GIT_REFRESH_SECONDS:-3600}
    volumes:
      - git-mirror-data:/var/lib/git

volumes:
  verdaccio-storage:
  verdaccio-plugins:
  pypi-mirror-cache:
  pypi-mirror-tmp:
  chrome-mirror-data:
  ffmpeg-mirror-data:
  git-mirror-data:

networks:
  default:
    name: hypit-internal-net