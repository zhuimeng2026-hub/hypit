# ffmpeg / ffprobe mirror.
#
# Layout on disk (populated by ffmpeg-mirror-bootstrap):
#   /usr/share/nginx/html/
#     ├── win64/ffmpeg-<version>-win64.zip           # for Win10 clients
#     ├── win64/ffmpeg-<version>-win64.txt           # SHA256 sidecar
#     ├── linux64/ffmpeg-<version>-linux64.tar.xz
#     └── macos/ffmpeg-<version>-macos.tar.xz
#
# The Provider does not download ffmpeg itself, but `hypit programs up` and `hypit
# doctor` look it up on the system PATH. This mirror is for one-off installers and
# for machines that do not yet have ffmpeg installed. The recommended Provider
# config on Win10 is:
#
#   { "ffmpegPath": "C:\\tools\\ffmpeg\\ffmpeg.exe",
#     "ffprobePath": "C:\\tools\\ffmpeg\\ffprobe.exe" }

server {
    listen       80 default_server;
    server_name  _;

    root  /usr/share/nginx/html;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location ~* \.(zip|tar\.xz|tar\.gz|txt)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}