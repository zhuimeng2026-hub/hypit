# Chrome Headless Shell mirror.
#
# Layout on disk (populated by chrome-mirror-bootstrap):
#   /usr/share/nginx/html/
#     ├── last-known-good.json
#     ├── linux64/<version>/chrome-headless-shell-linux64.zip
#     ├── mac-arm64/<version>/...
#     ├── mac-x64/<version>/...
#     ├── win32/<version>/chrome-headless-shell-win32.zip
#     └── win64/<version>/chrome-headless-shell-win64.zip
#
# The Provider hits this with @puppeteer/browsers using the configured
# `browserDownloadBaseUrl`. The URL the Provider constructs is
#   <base>/<platform>/<version>/<archive>
# which matches the upstream googleapis.com layout one-to-one.

server {
    listen       80 default_server;
    server_name  _;

    root  /usr/share/nginx/html;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # chrome-for-testing archives are immutable; let nginx cache aggressively on the
    # LAN side without round-tripping the provider.
    location ~* \.(zip|json)$ {
        add_header Cache-Control "public, max-age=86400, immutable" always;
    }

    # Belt-and-braces: refuse anything that isn't a chrome-for-testing path.
    location / {
        try_files $uri $uri/ =404;
    }

    # Health endpoint for compose / monitoring.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}