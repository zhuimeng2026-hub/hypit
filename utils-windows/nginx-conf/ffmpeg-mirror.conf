# ffmpeg / ffprobe mirror (Windows / nginx for Windows).
#
# Layout on disk (populated by setup-static-mirrors.ps1):
#   C:/tools/nginx/html/ffmpeg/
#     ├── win64/ffmpeg-master-latest-win64-gpl.zip
#     ├── linux64/ffmpeg-master-latest-linux64-gpl.tar.xz
#     ├── macos/ffmpeg-master-latest-macos.tar.xz
#     └── index.json

server {
    listen       8089 default_server;
    server_name  _;

    root  C:/tools/nginx/html/ffmpeg;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location ~* \.(zip|tar\.xz|tar\.gz|txt)$ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
