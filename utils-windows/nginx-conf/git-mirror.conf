# Read-only dumb-HTTP git mirror (Windows / nginx for Windows).
#
# Mirror the layout in utils/git-mirror/nginx.conf — but the root path
# points at the Win-native bare-repo location. Clients `git clone
# http://<host>:3030/hypit.git` resolve refs through /info/refs and fetch
# packs through /objects/pack/* — both standard git paths every git client
# understands.
#
# Read-only by construction: no CGI here to receive a push, so
# `git-receive-pack` is unreachable and `git push` fails cleanly.
#
# Layout on disk (populated by setup-static-mirrors.ps1):
#   C:/tools/nginx/html/git/hypit.git/   bare mirror of github.com/hypit-ai/hypit

server {
    listen       3030 default_server;
    server_name  _;

    client_max_body_size 500m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # /info/refs is rewritten by `git update-server-info`. It must be
    # served fresh so the client sees a current HEAD pointer.
    location = /hypit.git/info/refs {
        root   C:/tools/nginx/html/git;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Type "text/plain" always;
    }

    # Pack files are immutable — cache hard on the LAN. Capture the file
    # name so it appends to the alias instead of being eaten by the regex
    # match (which would otherwise leave nginx trying to serve the
    # directory and emitting a 301 redirect).
    location ~ ^/hypit\.git/objects/pack/(.+\.pack)$ {
        alias C:/tools/nginx/html/git/hypit.git/objects/pack/$1;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~ ^/hypit\.git/objects/pack/(.+\.idx)$ {
        alias C:/tools/nginx/html/git/hypit.git/objects/pack/$1;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Anything else under /hypit.git/ is repo metadata (HEAD, refs/,
    # packed-refs, loose objects, …). nginx regex locations don't support
    # `{n}` quantifiers and matching 40 hex chars explicitly would balloon
    # the config, so the broad alias handles it.
    location /hypit.git/ {
        alias C:/tools/nginx/html/git/hypit.git/;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        return 404 "Not Found\n";
        add_header Content-Type text/plain;
    }
}
