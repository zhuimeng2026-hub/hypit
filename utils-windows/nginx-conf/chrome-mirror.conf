# Chrome Headless Shell mirror (Windows / nginx for Windows).
#
# Mirror the layout in utils/nginx/conf.d/chrome-mirror.conf — but the root
# path points at the Win-native mirror directory. The URL shape
# <version>/<platform>/<archive> matches what the Provider constructs.
#
# Layout on disk (populated by setup-static-mirrors.ps1):
#   C:/tools/nginx/html/chrome/
#     ├── last-known-good.json
#     ├── linux64/<version>/chrome-headless-shell-linux64.zip
#     ├── mac-arm64/<version>/...
#     ├── mac-x64/<version>/...
#     ├── win32/<version>/chrome-headless-shell-win32.zip
#     └── win64/<version>/chrome-headless-shell-win64.zip

server {
    listen       8088 default_server;
    server_name  _;

    root  C:/tools/nginx/html/chrome;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location ~* \.(zip|json)$ {
        add_header Cache-Control "public, max-age=86400, immutable" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
