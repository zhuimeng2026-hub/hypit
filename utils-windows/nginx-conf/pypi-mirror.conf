# PyPI transparent cache (Windows / nginx for Windows).
#
# Reverse-proxies https://pypi.org/ with on-disk proxy_cache so the LAN
# never re-fetches the same wheel/sdist twice. Trust upstream
# Cache-Control (PyPI sets `public, max-age=31536000` on wheel/sdist
# responses and a short max-age on the simple index), with a 10-minute
# floor for safety. The nginx cache lives at C:/tools/nginx/cache/pypi.
#
# This mirrors utils/nginx/conf.d/pypi-mirror.conf so behaviour matches
# the Linux/Docker stack one-to-one.

proxy_cache_path C:/tools/nginx/cache/pypi levels=1:2 keys_zone=pypi_cache:64m max_size=200g
                 inactive=30d use_temp_path=off;

upstream pypi_upstream {
    server pypi.org:443;
    keepalive 16;
}

server {
    listen       4874 default_server;
    server_name  _;

    client_max_body_size 500m;

    location / {
        proxy_pass https://pypi_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host pypi.org;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_ssl_name pypi.org;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_cache pypi_cache;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 301 1m;
        proxy_cache_valid 302 1m;
        proxy_cache_valid any 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_min_uses 1;
        proxy_cache_revalidate on;
        proxy_cache_key "$scheme$request_uri";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
